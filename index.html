<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Council Incident Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Community Service Incidents Dashboard</h1>
        <p id="timestamp">Last Updated: <span id="lastUpdated">Loading...</span></p>
    </header>

    <main>
        <!-- KPI -->
        <section class="kpi-container">
            <div class="kpi-card">
                <h3>Total Cases</h3>
                <p id="totalCases" class="kpi-value">0</p>
            </div>
            <div class="kpi-card">
                <h3>Top Suburb (Most Issues)</h3>
                <p id="topSuburb" class="kpi-value">Loading...</p>
            </div>
        </section>

        <!-- 2 Charts (Doughnut & Line) -->
        <section class="charts-wrapper">
            <div class="chart-card">
                <h2>Incident Categories (%)</h2>
                <canvas id="doughnutChart"></canvas>
            </div>
            <div class="chart-card">
                <h2>Cases Trend (March)</h2>
                <canvas id="lineChart"></canvas>
            </div>
        </section>

        <!-- Table and Filter -->
        <section class="table-section">
            <div class="table-header">
                <h2>Recent Incident Records</h2>
                <div class="filters">
                    <input type="text" id="filterSuburb" placeholder="Search by Suburb...">
                    <input type="date" id="filterDate">
                </div>
            </div>
            <table id="incidentTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Suburb</th>
                        <th>Category</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Dữ liệu JS sẽ đổ vào đây -->
                </tbody>
            </table>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
