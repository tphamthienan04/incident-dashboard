<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Council Incident Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- Library Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Community Service Incidents Dashboard</h1>
        <!-- Khu vực Timestamp: Hiển thị thời gian cập nhật cuối cùng [1] -->
        <p id="timestamp">Last Updated: <span id="lastUpdated">Loading...</span></p>
    </header>

    <main>
        <!-- KPI zone: two columns for total [1] -->
        <section class="kpi-container">
            <div class="kpi-card">
                <h3>Total Graffiti</h3>
                <p id="graffitiCount" class="kpi-value">0</p>
            </div>
            <div class="kpi-card">
                <h3>Total Potholes</h3>
                <p id="potholeCount" class="kpi-value">0</p>
            </div>
        </section>

        <!-- Chart zone: canvas to draw chart [1] -->
        <section class="chart-section">
            <h2>Incident Distribution</h2>
            <canvas id="incidentChart"></canvas>
        </section>

        <!-- Table zone: list of problems [1] -->
        <section class="table-section">
            <h2>Recent Incident Records</h2>
            <table id="incidentTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Date</th>
                        <th>Suburb</th>
                        <th>Category</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data script.js will be added automatically -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Syn file logic JavaScript -->
    <script src="script.js"></script>
</body>
</html>
